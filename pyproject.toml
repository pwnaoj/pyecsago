[project]
name = "pyecsago"
version = "0.2.1"
description = "Python implementation of the evolutionary clustering ECSAGO - Evolutionary Clustering with Self Adaptive Genetic Operators"
authors = [{ name = "Joan Sebastian Tamayo Rivera" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=2.0,<3",
    "matplotlib>=3.9,<4",
    "scikit-learn>=1.5,<2",
    "pandas>=2.2,<3",
    "seaborn>=0.13,<1",
    "scipy>=1.14,<2",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
cuda = ["cupy-cuda12x>=13.3.0,<14"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=6.0,<7",
]
docs = [
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.29,<1",
    "mkdocs-jupyter>=0.25,<1",
    "mkdocs-include-markdown-plugin>=7.0,<8",
]

[tool.uv]
default-groups = "all"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pyecsago"]
omit = [
    "src/pyecsago/utils/cuda/*",
    "src/pyecsago/strategies/refinement/cuda_mde.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "pass$",
    "raise NotImplementedError",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"
